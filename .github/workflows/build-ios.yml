name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Package .ipa
        run: |
          # Flutter 3.27 outputs to build/ios/Release-iphoneos/
          APP_PATH=""
          for dir in "build/ios/Release-iphoneos/Runner.app" "build/ios/iphoneos/Runner.app"; do
            if [ -d "$dir" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          
          # Fallback: search everywhere
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: Runner.app not found"
            echo "=== build directory tree ==="
            find build -maxdepth 5 2>/dev/null | head -50
            exit 1
          fi
          
          echo "Found Runner.app at: $APP_PATH"
          
          # Show app structure
          echo "=== Runner.app contents ==="
          ls -la "$APP_PATH/"
          echo "=== Size ==="
          du -sh "$APP_PATH"
          
          # Create standard ipa structure
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          
          # Verify executable exists
          if [ ! -f "Payload/Runner.app/Runner" ]; then
            echo "FATAL: Runner executable not found in app bundle"
            exit 1
          fi
          
          echo "=== Runner executable found ✓ ==="
          zip -r -9 TaskPlanner.ipa Payload/
          
          # Verify ipa
          echo "=== .ipa contents ==="
          unzip -l TaskPlanner.ipa | grep -E "(Runner|Info)" | head -20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 30
