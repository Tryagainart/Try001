name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build_log.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Find Runner.app
        if: always()
        run: |
          echo "=== Build exit code: ${{ env.EXIT_CODE }} ==="
          echo "=== Searching entire workspace ==="
          find . -name "Runner.app" -type d 2>/dev/null
          echo "=== build directory contents ==="
          find build -maxdepth 4 -type f -o -type d 2>/dev/null | head -50
          echo "=== Build log tail ==="
          tail -30 /tmp/build_log.txt

      - name: Package .ipa
        run: |
          APP_PATH=$(find . -name "Runner.app" -type d | head -1)
          echo "Using: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 TaskPlanner.ipa Payload/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 30
