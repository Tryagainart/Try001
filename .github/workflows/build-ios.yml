name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Find and list build output
        run: |
          echo "=== Listing build/ios directory ==="
          find build/ios -name "*.app" -type d 2>/dev/null || echo "No .app found"
          echo "=== Full tree ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "iphoneos dir not found"
          ls -la build/ios/build/ 2>/dev/null || echo "build dir not found"
          echo "=== Search Runner.app ==="
          find build/ios -name "Runner.app" -type d

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 TaskPlanner.ipa Payload/

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 30

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-info
          path: build/ios/
          retention-days: 7
