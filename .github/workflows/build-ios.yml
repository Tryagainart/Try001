name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Show full build log
        if: always()
        run: |
          echo "=== EXIT CODE: ${{ env.EXIT_CODE }} ==="
          echo "=== Full build log ==="
          cat /tmp/build_log.txt

      - name: Package .ipa
        run: |
          APP_PATH=""
          for dir in "build/ios/Release-iphoneos/Runner.app" "build/ios/iphoneos/Runner.app"; do
            if [ -d "$dir" ] && [ -f "$dir/Runner" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Runner.app" -type d 2>/dev/null | while read d; do
              if [ -f "$d/Runner" ]; then echo "$d"; break; fi
            done)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: Valid Runner.app with Runner executable not found"
            exit 1
          fi
          
          echo "Found valid Runner.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r -9 TaskPlanner.ipa Payload/
          echo "=== .ipa verification ==="
          unzip -l TaskPlanner.ipa | grep "Runner" | head -20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 30
