name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          echo "=== Build exit code: ${{ env.EXIT_CODE }} ==="
          echo "=== Looking for Runner.app ==="
          find . -name "Runner.app" -type d 2>/dev/null
          echo "=== build/ios directory ==="
          ls -la build/ios/ 2>/dev/null || echo "build/ios not found"
          echo "=== build/ios/iphoneos directory ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "build/ios/iphoneos not found"
          echo "=== Last 20 lines of build log ==="
          tail -20 /tmp/build_log.txt

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in build/ios/iphoneos"
            echo "Trying broader search..."
            APP_PATH=$(find . -name "Runner.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "FATAL: Runner.app not found anywhere"
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          echo "=== Verifying Info.plist exists ==="
          ls -la "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 TaskPlanner.ipa Payload/
          echo "=== Verifying .ipa contents ==="
          unzip -l TaskPlanner.ipa | head -20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TaskPlanner-ipa
          path: TaskPlanner.ipa
          retention-days: 30
